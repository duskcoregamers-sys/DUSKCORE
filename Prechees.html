<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DUSKCORE — Match Verdict</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="duskcore logo.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root{
    --void:#0a0d0d;
    --panel:#12181a;
    --panel-edge:#1e2a2b;
    --emerald:#7fa650;
    --cyan:#00ffcc;
    --gold:#e8c468;
    --gold-dim:#7a6636;
    --loss-red:#ff4d5e;
    --ink:#e8ecea;
    --ink-dim:#7c8987;
    --serif:'Cinzel', serif;
    --sans:'Space Grotesk', sans-serif;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background:var(--void);
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
    overflow-x:hidden;
  }

  /* ---------- ambient chessboard floor ---------- */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(rgba(127,166,80,0.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(127,166,80,0.055) 1px, transparent 1px);
    background-size: 42px 42px;
    -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 20%, black 10%, transparent 75%);
    mask-image: radial-gradient(ellipse 90% 70% at 50% 20%, black 10%, transparent 75%);
    animation: drift 16s linear infinite;
    z-index:0;
    pointer-events:none;
  }
  @keyframes drift{
    from{ background-position: 0 0, 0 0; }
    to{ background-position: 42px 42px, 42px 42px; }
  }

  .scanline{
    position:fixed;
    left:0; right:0;
    height:2px;
    background:linear-gradient(90deg, transparent, rgba(0,255,204,0.5), transparent);
    animation: scan 5s ease-in-out infinite;
    z-index:1;
    pointer-events:none;
  }
  @keyframes scan{
    0%{ top:-2%; opacity:0; }
    8%{ opacity:1; }
    50%{ top:100%; opacity:.7; }
    58%{ opacity:0; }
    100%{ top:100%; opacity:0; }
  }

  main{
    position:relative;
    z-index:2;
    max-width:460px;
    margin:0 auto;
    padding:26px 18px 60px;
  }

  /* ---------- case bar ---------- */
  .case-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 4px 18px;
    border-bottom:1px solid var(--panel-edge);
    margin-bottom:26px;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:0.18em;
    color:var(--cyan);
    text-transform:uppercase;
    font-weight:600;
  }
  .room-tag{
    font-size:11px;
    letter-spacing:0.1em;
    color:var(--ink-dim);
    text-transform:uppercase;
  }
  .room-tag span{
    color:var(--gold);
    font-weight:600;
  }

  h1.verdict-title{
    font-family:var(--serif);
    font-weight:700;
    font-size:22px;
    text-align:center;
    letter-spacing:0.06em;
    margin:0 0 6px;
    color:var(--ink);
  }
  p.verdict-sub{
    text-align:center;
    font-size:12.5px;
    color:var(--ink-dim);
    margin:0 0 30px;
    letter-spacing:0.03em;
  }

  /* ---------- duel ---------- */
  .duel{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    margin-bottom:30px;
  }

  .player-card{
    flex:1;
    background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
    border:1px solid var(--panel-edge);
    border-radius:14px;
    padding:20px 10px 16px;
    text-align:center;
    cursor:pointer;
    position:relative;
    transition: border-color .25s ease, transform .25s ease, box-shadow .25s ease;
  }
  .player-card:active{ transform:scale(0.98); }

  .player-card.selected{
    border-color:var(--gold);
    box-shadow: 0 0 0 1px rgba(232,196,104,0.4), 0 0 26px rgba(232,196,104,0.22);
  }

  .player-card.rejected{
    opacity:0.4;
  }

  .crown-wrap{
    width:64px;
    height:64px;
    margin:0 auto 12px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }

  .crown-ring{
    position:absolute;
    inset:0;
    border-radius:50%;
    border:1px solid rgba(232,196,104,0.0);
    transition: border-color .3s ease, box-shadow .3s ease;
  }
  .player-card.selected .crown-ring{
    border-color:rgba(232,196,104,0.55);
    box-shadow:0 0 18px rgba(232,196,104,0.35), inset 0 0 14px rgba(232,196,104,0.25);
    animation: pulse-ring 2.2s ease-in-out infinite;
  }
  @keyframes pulse-ring{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.06); }
  }

  .crown-icon{
    width:34px; height:34px;
    stroke:#4a5654;
    fill:none;
    stroke-width:1.6;
    transition: stroke .3s ease, filter .3s ease;
  }
  .player-card.selected .crown-icon{
    stroke:var(--gold);
    fill:rgba(232,196,104,0.12);
    filter:drop-shadow(0 0 6px rgba(232,196,104,0.7));
  }

  .player-name{
    font-family:var(--serif);
    font-size:15px;
    font-weight:600;
    color:var(--ink);
    word-break:break-word;
    line-height:1.25;
  }
  .player-room{
    font-size:10.5px;
    color:var(--cyan);
    letter-spacing:0.05em;
    margin-top:4px;
    opacity:0.8;
  }
  .player-room span{
    font-weight:600;
  }

  .player-tag{
    font-size:9.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin-top:5px;
  }
  .player-card.selected .player-tag{
    color:var(--gold);
  }
  .player-card.selected .player-tag::after{
    content:" · WINNER";
  }

  .vs-divider{
    font-family:var(--serif);
    font-size:13px;
    letter-spacing:0.1em;
    color:var(--cyan);
    padding:0 8px;
    text-shadow:0 0 10px rgba(0,255,204,0.5);
  }

  .hint{
    text-align:center;
    font-size:11px;
    color:var(--ink-dim);
    margin:-16px 0 26px;
    letter-spacing:0.03em;
  }

  /* ---------- proof panel ---------- */
  .panel-label{
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--cyan);
    margin-bottom:10px;
  }

  .upload-slot{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:26px 16px;
    border:1px dashed var(--panel-edge);
    border-radius:12px;
    background:var(--panel);
    cursor:pointer;
    transition: border-color .25s ease, background .25s ease;
  }
  .upload-slot:hover{
    border-color:var(--cyan);
    background:#141c1d;
  }
  .upload-slot.filled{
    border-style:solid;
    border-color:var(--emerald);
  }

  .upload-icon{
    width:30px; height:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    border:1px solid var(--panel-edge);
    color:var(--ink-dim);
    font-size:15px;
  }
  .upload-slot:hover .upload-icon{
    border-color:var(--cyan);
    color:var(--cyan);
  }

  .upload-text{
    font-size:12.5px;
    color:var(--ink-dim);
    text-align:center;
  }
  .upload-slot.filled .upload-text{ color:var(--emerald); }

  .preview-wrap{
    margin-top:12px;
    border-radius:10px;
    overflow:hidden;
    border:1px solid var(--panel-edge);
    display:none;
  }
  .preview-wrap img{
    display:block;
    width:100%;
    max-height:220px;
    object-fit:cover;
  }

  /* ---------- seal button ---------- */
  .seal-btn{
    width:100%;
    margin-top:30px;
    padding:15px;
    border-radius:8px;
    border:1px solid var(--emerald);
    background:linear-gradient(180deg, rgba(127,166,80,0.18), rgba(127,166,80,0.05));
    color:var(--emerald);
    font-family:var(--serif);
    font-weight:700;
    font-size:14px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    transition: color .2s ease, background .2s ease, box-shadow .2s ease;
  }
  .seal-btn:not(:disabled):hover{
    color:#0a0d0d;
    background:var(--emerald);
    box-shadow:0 0 24px rgba(127,166,80,0.45);
  }
  .seal-btn:disabled{
    opacity:0.35;
    cursor:not-allowed;
  }

  .status-msg{
    text-align:center;
    font-size:12px;
    color:var(--ink-dim);
    margin-top:14px;
    min-height:16px;
    letter-spacing:0.02em;
  }
  .status-msg.ok{ color:var(--emerald); }
  .status-msg.err{ color:var(--loss-red); }

  /* ---------- verdict overlay ---------- */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(10,13,13,0.92);
    backdrop-filter: blur(3px);
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:14px;
    z-index:50;
    text-align:center;
    padding:20px;
  }
  .overlay.show{ display:flex; }
  .overlay .seal-mark{
    width:78px; height:78px;
    border-radius:50%;
    border:1px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 30px rgba(232,196,104,0.4);
    animation: pulse-ring 2s ease-in-out infinite;
  }
  .overlay .seal-mark svg{ width:34px; height:34px; stroke:var(--gold); fill:none; stroke-width:1.6; }
  .overlay h2{
    font-family:var(--serif);
    font-size:19px;
    letter-spacing:0.08em;
    margin:0;
    color:var(--gold);
  }
  .overlay p{
    font-size:12.5px;
    color:var(--ink-dim);
    margin:0;
    max-width:280px;
  }
</style>
</head>

<body>

<div class="scanline"></div>

<div class="overlay" id="overlay">
  <div class="seal-mark">
    <svg viewBox="0 0 24 24"><path d="M12 2l2.2 4.9L19.5 7l-3.6 3.7.9 5.1L12 13.8 7.2 15.8l.9-5.1L4.5 7l5.3-.1L12 2z"/></svg>
  </div>
  <h2>Verdict Sealed</h2>
  <p id="overlayText">The board has recorded its outcome. Returning to dashboard…</p>
</div>

<main>

  <div class="case-bar">
    <span class="eyebrow">Duskcore // Match Verdict</span>
    <span class="room-tag">ROOM <span id="roomLabel">—</span></span>
  </div>

  <h1 class="verdict-title">Declare the Winner</h1>
  <p class="verdict-sub">Tap a crown to crown the victor, then attach proof.</p>

  <section class="duel">
    <div class="player-card" id="cardA" onclick="selectWinner('A')">
      <div class="crown-wrap">
        <div class="crown-ring"></div>
        <svg class="crown-icon" viewBox="0 0 24 24">
          <path d="M3 8l3 3 3-5 3 5 3-5 3 5 3-3-2 10H5L3 8z"/>
          <path d="M6 21h12"/>
        </svg>
      </div>
      <div class="player-name" id="nameA">Username A</div>
      <div class="player-room">Room <span id="roomA">—</span></div>
      <div class="player-tag">You</div>
    </div>

    <span class="vs-divider">VS</span>

    <div class="player-card" id="cardB" onclick="selectWinner('B')">
      <div class="crown-wrap">
        <div class="crown-ring"></div>
        <svg class="crown-icon" viewBox="0 0 24 24">
          <path d="M3 8l3 3 3-5 3 5 3-5 3 5 3-3-2 10H5L3 8z"/>
          <path d="M6 21h12"/>
        </svg>
      </div>
      <div class="player-name" id="nameB">Username B</div>
      <div class="player-room">Room <span id="roomB">—</span></div>
      <div class="player-tag">Opponent</div>
    </div>
  </section>

  <p class="hint" id="selectionHint">No winner selected yet</p>

  <div class="panel-label">Proof of Result</div>
  <label class="upload-slot" id="uploadSlot">
    <input type="file" id="screenshotInput" accept="image/*" hidden onchange="handleFile(event)">
    <div class="upload-icon" id="uploadIcon">⎋</div>
    <div class="upload-text" id="uploadText">Tap to upload a screenshot of the final board</div>
  </label>
  <div class="preview-wrap" id="previewWrap">
    <img id="previewImg" alt="Result screenshot preview">
  </div>

  <button id="submitBtn" class="seal-btn" onclick="submitVerdict()" disabled>Seal Verdict</button>
  <p class="status-msg" id="statusMsg"></p>

</main>

<script>
// ---------- Supabase config (same project as chessqm.html) ----------
const supabaseUrl = "https://ldgnyehqrharqvynohla.supabase.co";
const supabaseAnonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxkZ255ZWhxcmhhcnF2eW5vaGxhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMzgzMDcsImV4cCI6MjA5NDYxNDMwN30.80vZuD20je-8VKDJwoy7P2mFYqY9Vcq3nMd9K-pHYBI";
const supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey);

const MATCH_TABLE = 'chess-quick-match';
const SCREENSHOT_BUCKET = 'chess-screenshots'; // must exist as a public Storage bucket in Supabase

// ---------- Read context from URL + login ----------
const params = new URLSearchParams(window.location.search);
const rowId = params.get('id');
const roomcode = params.get('room') || '';
const opponentUsername = params.get('opponent') || 'Opponent';
let opponentRoomcode = params.get('oroom') || '';
const currentUser = localStorage.getItem('dusk_username');

let selectedWinner = null; // 'A' (me) or 'B' (opponent)
let uploadedFile = null;
let uploadedUrl = null;

async function init(){
  if(!currentUser){
    alert("Please login first!");
    window.location.href = "login.html";
    return;
  }
  document.getElementById('nameA').innerText = currentUser;
  document.getElementById('nameB').innerText = opponentUsername;
  document.getElementById('roomLabel').innerText = roomcode || '—';
  document.getElementById('roomA').innerText = roomcode || '—';
  document.getElementById('roomB').innerText = opponentRoomcode || '…';

  // Fallback: if the opponent's room code wasn't passed in the URL, fetch it
  if(!opponentRoomcode){
    try {
      const { data, error } = await supabaseClient
        .from(MATCH_TABLE)
        .select('roomcode')
        .eq('username', opponentUsername)
        .eq('opponent', currentUser)
        .order('created_at', { ascending: false })
        .limit(1)
        .single();

      if(!error && data){
        opponentRoomcode = data.roomcode;
        document.getElementById('roomB').innerText = opponentRoomcode || '—';
      } else {
        document.getElementById('roomB').innerText = '—';
      }
    } catch(e){
      document.getElementById('roomB').innerText = '—';
    }
  }
}
init();

function selectWinner(who){
  selectedWinner = who;
  const cardA = document.getElementById('cardA');
  const cardB = document.getElementById('cardB');

  cardA.classList.toggle('selected', who === 'A');
  cardA.classList.toggle('rejected', who === 'B');
  cardB.classList.toggle('selected', who === 'B');
  cardB.classList.toggle('rejected', who === 'A');

  const winnerName = who === 'A' ? currentUser : opponentUsername;
  document.getElementById('selectionHint').innerText = `${winnerName} crowned victor`;

  updateSubmitState();
}

function handleFile(evt){
  const file = evt.target.files[0];
  if(!file) return;

  uploadedFile = file;

  const reader = new FileReader();
  reader.onload = (e) => {
    document.getElementById('previewImg').src = e.target.result;
    document.getElementById('previewWrap').style.display = 'block';
  };
  reader.readAsDataURL(file);

  document.getElementById('uploadSlot').classList.add('filled');
  document.getElementById('uploadIcon').innerText = '✓';
  document.getElementById('uploadText').innerText = file.name;

  updateSubmitState();
}

function updateSubmitState(){
  document.getElementById('submitBtn').disabled = !(selectedWinner && uploadedFile);
}

async function submitVerdict(){
  const btn = document.getElementById('submitBtn');
  const statusMsg = document.getElementById('statusMsg');

  btn.disabled = true;
  btn.innerText = 'Sealing…';
  statusMsg.className = 'status-msg';
  statusMsg.innerText = '';

  try {
    // 1. Upload screenshot to Storage
    const ext = uploadedFile.name.split('.').pop();
    const path = `${roomcode || 'match'}-${currentUser}-${Date.now()}.${ext}`;

    const { error: uploadErr } = await supabaseClient
      .storage
      .from(SCREENSHOT_BUCKET)
      .upload(path, uploadedFile);

    if(uploadErr) throw uploadErr;

    const { data: urlData } = supabaseClient
      .storage
      .from(SCREENSHOT_BUCKET)
      .getPublicUrl(path);

    uploadedUrl = urlData.publicUrl;

    const winnerName = selectedWinner === 'A' ? currentUser : opponentUsername;

    // 2. Update my own row
    let myRowQuery = supabaseClient.from(MATCH_TABLE).update({
      results: winnerName,
      screenshot_url: uploadedUrl,
      status: 'completed'
    });

    if(rowId){
      myRowQuery = myRowQuery.eq('id', rowId);
    } else {
      myRowQuery = myRowQuery.eq('username', currentUser).eq('roomcode', roomcode);
    }

    const { error: myUpdateErr } = await myRowQuery;
    if(myUpdateErr) throw myUpdateErr;

    // 3. Mirror the result onto the opponent's row so both sides agree
    try {
      await supabaseClient
        .from(MATCH_TABLE)
        .update({
          results: winnerName,
          screenshot_url: uploadedUrl,
          status: 'completed'
        })
        .eq('username', opponentUsername)
        .eq('opponent', currentUser);
    } catch(e){
      console.log('Opponent row mirror skipped:', e.message);
    }

    // 4. Log to community chat
    try {
      await supabaseClient
        .from('community_chat')
        .insert([{
          category: 'General',
          user_name: '♟️ CHESS MATCH',
          text: `Verdict sealed on Room [ ${roomcode} ]: [ ${winnerName} ] claims victory over [ ${winnerName === currentUser ? opponentUsername : currentUser} ]!`
        }]);
    } catch(e){
      console.log('Chat log skipped');
    }

    statusMsg.className = 'status-msg ok';
    statusMsg.innerText = 'Verdict recorded.';

    document.getElementById('overlayText').innerText =
      `${winnerName} takes the board. Returning to dashboard…`;
    document.getElementById('overlay').classList.add('show');

    setTimeout(() => {
      window.location.href = 'dashboard.html';
    }, 2600);

  } catch(err){
    statusMsg.className = 'status-msg err';
    statusMsg.innerText = 'Failed to seal verdict: ' + err.message;
    btn.disabled = false;
    btn.innerText = 'Seal Verdict';
  }
}
</script>

</body>
</html>
