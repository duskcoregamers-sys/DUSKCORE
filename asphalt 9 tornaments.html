<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <title>DUSKCORE - Asphalt 9 Tournaments</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="duskcore logo.jpg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background: radial-gradient(circle at top, #1a0a2a, #000); color: white; padding-bottom: 80px; }
        h1, h2 { color: #a020f0; text-align: center; text-shadow: 0 0 10px #a020f0; text-transform: uppercase; }
        .category-title { background: rgba(160, 32, 240, 0.2); padding: 12px; text-align: center; border-top: 1px solid #a020f0; border-bottom: 1px solid #a020f0; margin-top: 30px; text-transform: uppercase; letter-spacing: 1px; }
        .wallet-display { background: rgba(160, 32, 240, 0.08); border: 1px solid rgba(160, 32, 240, 0.4); border-radius: 10px; padding: 10px; max-width: 400px; margin: 15px auto; display: flex; justify-content: space-around; font-weight: bold; }
        .t-card { width: 90%; max-width: 500px; margin: 20px auto; border: 1px solid #a020f0; border-radius: 15px; background: rgba(10, 5, 15, 0.9); overflow: hidden; box-shadow: 0 5px 15px rgba(160, 32, 240, 0.2); }
        .t-card img { width: 100%; height: 190px; object-fit: cover; border-bottom: 1px solid #a020f0; }
        .t-details { padding: 20px; }
        .badge { display: inline-block; background: #a020f0; color: white; padding: 4px 10px; border-radius: 5px; font-size: 11px; font-weight: bold; margin-bottom: 10px; text-transform: uppercase; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 15px 0; }
        .info-box { background: rgba(160, 32, 240, 0.05); padding: 10px; border-radius: 8px; border: 1px solid rgba(160, 32, 240, 0.3); text-align: center; font-size: 14px; }
        .countdown { color: #ff3366; font-weight: bold; font-family: monospace; font-size: 16px; }
        .btn-join { display: block; width: 100%; padding: 14px; text-align: center; background: #a020f0; color: white; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        .btn-join:hover { background: #bc3df5; box-shadow: 0 0 15px rgba(160, 32, 240, 0.5); }
        .btn-disabled { background: #333 !important; color: #777 !important; cursor: not-allowed; }
        .dashboard { position: fixed; bottom: 20px; right: 20px; padding: 15px 25px; background: #a020f0; color: white; border-radius: 50px; text-decoration: none; font-weight: bold; z-index: 1000; }
    </style>
</head>
<body>

<h1>🏆 ASPHALT 9 TOURNAMENTS</h1>

<div class="wallet-display">
    <span>🔴 Red: <span id="walletRed">...</span></span>
    <span>🔵 Blue: <span id="walletBlue">...</span></span>
    <span>🟣 Super: <span id="walletSuper">...</span></span>
</div>

<h2 class="category-title">🟢 ONGOING TOURNAMENTS</h2>
<div id="ongoingContainer"></div>

<h2 class="category-title">⏳ UPCOMING TOURNAMENTS</h2>
<div id="upcomingContainer"></div>

<a class="dashboard" href="dashboard.html">Dashboard</a>

<script>
const supabaseClient = supabase.createClient(
    "https://ldgnyehqrharqvynohla.supabase.co", 
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxkZ255ZWhxcmhhcnF2eW5vaGxhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMzgzMDcsImV4cCI6MjA5NDYxNDMwN30.80vZuD20je-8VKDJwoy7P2mFYqY9Vcq3nMd9K-pHYBI"
);

const dbColumns = { "Red Coins": 'red_coins', "Blue Coins": 'blue_coins', "Super Coins": 'super_coins' };
const coinIcons = { "Red Coins": "🔴 Red", "Blue Coins": "🔵 Blue", "Super Coins": "🟣 Super" };
let currentUser = localStorage.getItem("dusk_username");
let activeTimers = [];
let userTournaments = new Set();

async function loadUserTournaments() {
    if (!currentUser) return;
    let { data: uTournaments } = await supabaseClient
        .from('asphalt_participants')
        .select('tournament_id')
        .eq('username', currentUser);
    
    if (uTournaments) {
        uTournaments.forEach(t => userTournaments.add(t.tournament_id));
    }
}

async function loadLiveWallet() {
    if (!currentUser) return;
    let { data: profile } = await supabaseClient.from('user_profile').select('*').eq('username', currentUser).single();
    if (profile) {
        document.getElementById("walletRed").innerText = profile.red_coins || 0;
        document.getElementById("walletBlue").innerText = profile.blue_coins || 0;
        document.getElementById("walletSuper").innerText = profile.super_coins || 0;
    }
}

async function loadTournaments() {
    activeTimers.forEach(clearInterval);
    activeTimers = [];
    let ongoingHTML = "", upcomingHTML = "", now = Date.now();

    // FILTER KALI: Asphalt 9 pekee na isleague=false
    let { data: tList } = await supabaseClient
        .from('tournaments')
        .select('*')
        .ilike('game', '%Asphalt%')
        .eq('isleague', false)
        .order('start_date', { ascending: true });

    if (!tList || tList.length === 0) {
        document.getElementById("ongoingContainer").innerHTML = "<p style='text-align:center'>Hakuna.</p>";
        document.getElementById("upcomingContainer").innerHTML = "<p style='text-align:center'>Hakuna.</p>";
        return;
    }

    tList.forEach((t) => {
        let startMs = new Date(t.start_date).getTime();
        let expireMs = new Date(t.end_date).getTime();
        if (now > expireMs) return;

        let joinedCount = t.joined || 0;
        let maxPlayers = t.max_players || 16;
        let isFull = joinedCount >= maxPlayers;
        let isOngoing = now >= startMs;

        let imageSrc = t.image_url ? t.image_url : "https://via.placeholder.com/500x200?text=Asphalt+9+Tournament";

        let isUserRegistered = userTournaments.has(t.id);
        let buttonHTML = '';
        
        if (isUserRegistered) {
            buttonHTML = `<button class="btn-join" onclick="enterTournament(${t.id}, '${t.title.replace(/'/g, "\\'")}')" style="background: #00d084;">🎮 INTER TOURNAMENT</button>`;
        } else {
            buttonHTML = `<button class="btn-join ${isFull ? 'btn-disabled' : ''}" ${isFull ? 'disabled' : ''} onclick="joinTournament(${t.id}, ${t.fee_amount}, '${t.fee_type}', '${t.title.replace(/'/g, "\\'")}')">${isFull ? '❌ FULL' : 'JOIN TOURNAMENT'}</button>`;
        }

        let card = `
        <div class="t-card">
            <img src="${imageSrc}" alt="${t.title}">
            <div class="t-details">
                <span class="badge">ASPHALT 9 - ${t.format.toUpperCase()}</span>
                <h3>${t.title}</h3>
                <p>${t.description || ""}</p>
                <div class="info-grid">
                    <div class="info-box"><b>FEE</b><br>${t.fee_amount} ${t.fee_type}</div>
                    <div class="info-box"><b>STATUS</b><br>${joinedCount}/${maxPlayers}</div>
                </div>
                ${!isOngoing ? `<div style="text-align:center">Starts in: <span class="countdown" id="cd_start_${t.id}">Loading...</span></div>` : `<div style="text-align:center">▶️ ONGOING</div>`}
                ${buttonHTML}
            </div>
        </div>`;

        isOngoing ? ongoingHTML += card : upcomingHTML += card;
        if (now < startMs) startCountdown("cd_start_" + t.id, startMs);
    });

    document.getElementById("ongoingContainer").innerHTML = ongoingHTML || "<p style='text-align:center'>Hakuna.</p>";
    document.getElementById("upcomingContainer").innerHTML = upcomingHTML || "<p style='text-align:center'>Hakuna.</p>";
}

function startCountdown(elementId, targetTime) {
    let interval = setInterval(() => {
        let diff = targetTime - Date.now();
        if (diff <= 0) { clearInterval(interval); loadTournaments(); }
        else {
            let h = Math.floor(diff / (1000 * 60 * 60)), m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)), s = Math.floor((diff % (1000 * 60)) / 1000);
            document.getElementById(elementId).innerText = `${h}h ${m}m ${s}s`;
        }
    }, 1000);
    activeTimers.push(interval);
}

async function joinTournament(tId, fee, coinType, title) {
    if (!confirm(`Jiunge na "${title}"?`)) return;
    try {
        let { data: profile } = await supabaseClient.from('user_profile').select('*').eq('username', currentUser).single();
        let targetCol = dbColumns[coinType];
        if (profile[targetCol] < fee) { alert("Salio halitoshi!"); return; }
        
        // 1. Deduct coins from wallet
        await supabaseClient.from('user_profile').update({ [targetCol]: profile[targetCol] - fee }).eq('username', currentUser);
        
        // 2. Increment joined count
        let { data: tData } = await supabaseClient.from('tournaments').select('joined').eq('id', tId).single();
        await supabaseClient.from('tournaments').update({ joined: tData.joined + 1 }).eq('id', tId);
        
        // 3. Register participant in asphalt_participants table
        await supabaseClient.from('asphalt_participants').insert({
            tournament_id: tId,
            username: currentUser,
            points: 0
        });
        
        alert("✅ Umefaulu!");
        location.reload();
    } catch(err) { alert("Error: " + err.message); }
}

async function enterTournament(tId, title) {
    try {
        // Fetch tournament data to get sub_format
        let { data: tournament } = await supabaseClient
            .from('tournaments')
            .select('sub_format')
            .eq('id', tId)
            .single();
        
        if (!tournament) {
            alert("Tournament not found!");
            return;
        }
        
        let subFormat = tournament.sub_format.toLowerCase().trim();
        let pageMap = {
            'road8': 'road8.html',
            'road 16': 'road16.html',
            'road 32': 'road32.html',
            'single knockout': 'Asingle_knockout.html',
            'double knockout': 'Adouble_knockout.html'
        };
        
        let targetPage = pageMap[subFormat];
        
        if (!targetPage) {
            alert(`Unknown tournament format: ${subFormat}`);
            return;
        }
        
        // Navigate to appropriate page with tournament ID
        window.location.href = `${targetPage}?tournament_id=${tId}`;
    } catch(err) {
        alert("Error: " + err.message);
    }
}

window.onload = async () => { 
    await loadLiveWallet(); 
    await loadUserTournaments(); 
    await loadTournaments(); 
};
</script>
</body>
</html>
