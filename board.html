<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <title>Tournament Board - DUSKCORE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #000; color: white; padding: 20px; margin: 0; }
        .board-container { max-width: 900px; margin: auto; background: #0a0a0a; border: 1px solid #a020f0; border-radius: 15px; padding: 20px; box-shadow: 0 0 20px rgba(160,32,240,0.2); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #111; }
        th, td { padding: 10px; text-align: center; border: 1px solid #333; font-size: 14px; }
        th { color: #a020f0; background: #1a0a2a; }
        h2, h3 { text-align: center; color: #a020f0; text-transform: uppercase; }
        .back-btn { display: inline-block; padding: 10px 20px; background: #a020f0; color: white; text-decoration: none; border-radius: 5px; margin-bottom: 20px; font-weight: bold; }
        .match-box { background: #1a1a1a; padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #555; text-align: center; }
        .gold-row { color: gold; font-weight: bold; }
        .blue-row { color: #00bfff; font-weight: bold; }
        .my-row { border: 2px solid #a020f0 !important; background: rgba(160,32,240,0.1); }
        
        /* Start Button Styles */
        #startBtn { padding: 15px 30px; background: #a020f0; color: white; border: none; cursor: pointer; border-radius: 8px; font-weight: bold; font-size: 16px; width: 100%; transition: 0.3s; }
        #startBtn:hover:not(:disabled) { background: #8a1be0; box-shadow: 0 0 15px #a020f0; }
        #startBtn:disabled { background: #333; color: #888; cursor: not-allowed; border: 1px solid #555; box-shadow: none; }
        .status-msg { color: #ffeb3b; font-size: 14px; margin-top: 10px; display: block; }
        
        /* Stats & Fixtures UI */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 20px 0; }
        .stat-card { background: rgba(160,32,240,0.1); border: 1px solid #a020f0; padding: 15px; border-radius: 8px; text-align: center; }
        .stat-card h4 { margin: 0 0 5px 0; font-size: 12px; color: #ccc; }
        .stat-card span { font-size: 20px; font-weight: bold; color: white; }
        
        .wave-container { background: #111; border: 1px solid #333; border-radius: 8px; margin-bottom: 15px; padding: 15px; }
        .wave-title { color: #00c853; border-bottom: 1px solid #333; padding-bottom: 5px; margin-top: 0; }
        .fixture { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #222; }
        .fixture:last-child { border-bottom: none; }
        
        .export-btns { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
        .btn-export { padding: 10px 15px; background: #333; color: white; border: 1px solid #555; border-radius: 5px; cursor: pointer; }
        .btn-export:hover { background: #444; }
    </style>
</head>
<body>
<div class="board-container">
    <a href="efootball.html" class="back-btn">⬅️ Back to Tournaments</a>
    <h2 id="tourneyTitle">Loading...</h2>
    
    <div class="match-box">
        <h3>Your Status</h3>
        <button id="startBtn" onclick="startMatch()" disabled>LOADING...</button>
        <span id="statusMsg" class="status-msg">Inatafuta taarifa za tournament...</span>
    </div>

    <table>
        <thead>
            <tr><th>Pos</th><th>Player</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr>
        </thead>
        <tbody id="leaderboardBody"></tbody>
    </table>

    <div id="scheduleSection" style="display: none; margin-top: 40px;">
        <h2>Tournament Schedule (Round Robin)</h2>
        <div class="stats-grid" id="statsGrid"></div>
        <div id="fixturesList"></div>
        
        <div class="export-btns">
            <button class="btn-export" onclick="exportCSV()">Export CSV</button>
            <button class="btn-export" onclick="exportJSON()">Export JSON</button>
            <button class="btn-export" onclick="window.print()">Print Schedule</button>
        </div>
    </div>
</div>

<script>
// Supabase Configuration
const sb = supabase.createClient('https://ldgnyehqrharqvynohla.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxkZ255ZWhxcmhhcnF2eW5vaGxhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMzgzMDcsImV4cCI6MjA5NDYxNDMwN30.80vZuD20je-8VKDJwoy7P2mFYqY9Vcq3nMd9K-pHYBI');
const tid = new URLSearchParams(window.location.search).get('tid');
const currentUser = localStorage.getItem("dusk_username");

let tournamentData = null;
let participantsData = [];
let matchesData = [];

// Formulas Validation Variables
let statsInfo = {};

async function loadBoard() {
    try {
        if (!tid) throw new Error("ID ya Tournament haipatikani");

        // 1. Fetch Tournament Info
        const { data: t, error: tErr } = await sb.from('tournaments').select('*').eq('id', tid).single();
        if (tErr) throw new Error("Imeshindwa kupata taarifa za tournament");
        tournamentData = t;
        document.getElementById('tourneyTitle').innerText = t.title;

        // 2. Fetch Participants
        const { data: participants, error: pErr } = await sb.from('tornamenents_participants').select('*').eq('tournament_id', tid);
        if (pErr) throw new Error("Imeshindwa kupata washiriki");
        participantsData = participants;
        
        // 3. Render Leaderboard
        participants.sort((a, b) => (b.pts - a.pts) || (b.gd - a.gd) || (b.gf - a.gf));
        document.getElementById('leaderboardBody').innerHTML = participants.map((p, i) => {
            let pos = i + 1;
            let rowClass = pos <= 8 ? "gold-row" : "";
            return `<tr class="${rowClass} ${p.player_name === currentUser ? 'my-row' : ''}">
                <td>${pos}</td><td>${p.player_name}</td><td>${p.p}</td><td>${p.w}</td><td>${p.d}</td><td>${p.l}</td><td>${p.gf}</td><td>${p.ga}</td><td>${p.gd}</td><td>${p.pts}</td>
            </tr>`;
        }).join('');

        // 4. Check Readiness (Start Button Logic)
        checkTournamentStatus();

    } catch (err) {
        console.error(err);
        document.getElementById('statusMsg').innerText = `⚠️ Error: ${err.message}`;
    }
}

async function checkTournamentStatus() {
    const btn = document.getElementById('startBtn');
    const msg = document.getElementById('statusMsg');
    
    const maxPlayers = tournamentData.max_players || 16;
    const currentPlayers = participantsData.length;
    const isFull = currentPlayers >= maxPlayers;
    
    const startTime = new Date(tournamentData.start_date).getTime();
    const now = Date.now();
    const hasStarted = now >= startTime;

    if (!isFull) {
        btn.disabled = true;
        btn.innerText = "WAITING FOR PLAYERS";
        msg.innerText = `Tournament haijajaa (${currentPlayers}/${maxPlayers} wameingia).`;
        return;
    }

    if (!hasStarted) {
        btn.disabled = true;
        btn.innerText = "WAITING FOR COUNTDOWN";
        
        // Setup timer to refresh when it starts
        const diff = startTime - now;
        setTimeout(loadBoard, diff + 1000); 
        
        let h = Math.floor(diff / (1000 * 60 * 60));
        let m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        msg.innerText = `starts in: ${h}h ${m}m. wait...`;
        return;
    }

    // It is FULL and STARTED. Let's check if Fixtures exist.
    btn.innerText = "START MATCH";
    btn.disabled = false;
    msg.innerText = "Ratiba imekamilika! Uko tayari kucheza.";

    await processRoundRobinMatches();
}

// ----------------------------------------------------
// ROUND ROBIN ALGORITHM (Circle Method) & DATABASE SYNC
// ----------------------------------------------------
async function processRoundRobinMatches() {
    // Check if matches already generated in DB
    const { data: existingMatches, error } = await sb.from('Tournaments_matches').select('*').eq('tournament_id', tid).order('wave', { ascending: true });
    
    if (existingMatches && existingMatches.length > 0) {
        matchesData = existingMatches;
        calculateStats(participantsData.length);
        displaySchedule();
        return;
    }

    // If no matches, GENERATE them strictly following formulas
    let players = participantsData.map(p => p.player_name);
    let n = players.length;
    
    if (n % 2 !== 0) {
        players.push("BYE");
        n++;
    }

    const totalWaves = n - 1;
    const half = n / 2;
    const newMatches = [];

    // Berger Algorithm Generation
    let currentPlayers = [...players];
    for (let wave = 1; wave <= totalWaves; wave++) {
        for (let i = 0; i < half; i++) {
            let p1 = currentPlayers[i];
            let p2 = currentPlayers[n - 1 - i];
            
            // Validate: No Bye vs Bye
            if (p1 !== "BYE" && p2 !== "BYE") {
                newMatches.push({
                    tournament_id: tid,
                    player1: p1,
                    player2: p2,
                    wave: wave,
                    start: false
                });
            }
        }
        // Rotate (keep index 0 fixed, shift others)
        currentPlayers.splice(1, 0, currentPlayers.pop());
    }

    // Insert into Supabase
    const { data: insertedData, error: insertErr } = await sb.from('Tournaments_matches').insert(newMatches).select();
    
    if (insertErr) {
        console.error("Failed to save matches:", insertErr);
        document.getElementById('statusMsg').innerText = "Kuna tatizo kuokoa ratiba kwenye mfumo.";
    } else {
        matchesData = insertedData;
        calculateStats(participantsData.length);
        displaySchedule();
    }
}

function calculateStats(N) {
    let isOdd = N % 2 !== 0;
    let logicalN = isOdd ? N + 1 : N;
    
    statsInfo = {
        totalPlayers: N,
        totalWaves: logicalN - 1,
        matchesPerWave: isOdd ? (N - 1) / 2 : N / 2,
        totalMatches: (N * (N - 1)) / 2,
        matchesPerPlayer: N - 1
    };
}

function displaySchedule() {
    document.getElementById('scheduleSection').style.display = 'block';

    // 1. Render Stats Grid
    document.getElementById('statsGrid').innerHTML = `
        <div class="stat-card"><h4>Total Players</h4><span>${statsInfo.totalPlayers}</span></div>
        <div class="stat-card"><h4>Total Waves</h4><span>${statsInfo.totalWaves}</span></div>
        <div class="stat-card"><h4>Matches/Wave</h4><span>${statsInfo.matchesPerWave}</span></div>
        <div class="stat-card"><h4>Total Matches</h4><span>${statsInfo.totalMatches}</span></div>
        <div class="stat-card"><h4>Matches/Player</h4><span>${statsInfo.matchesPerPlayer}</span></div>
    `;

    // 2. Render Waves (Fixtures)
    const groupedByWave = {};
    matchesData.forEach(m => {
        if (!groupedByWave[m.wave]) groupedByWave[m.wave] = [];
        groupedByWave[m.wave].push(m);
    });

    let fixturesHTML = "";
    for (let wave in groupedByWave) {
        fixturesHTML += `<div class="wave-container">
            <h3 class="wave-title">Wave ${wave}</h3>`;
        
        groupedByWave[wave].forEach(match => {
            let isMyMatch = (match.player1 === currentUser || match.player2 === currentUser);
            let highlight = isMyMatch ? 'style="color: #a020f0; font-weight: bold;"' : '';
            fixturesHTML += `
                <div class="fixture" ${highlight}>
                    <span>${match.player1}</span>
                    <span>VS</span>
                    <span>${match.player2}</span>
                </div>`;
        });
        fixturesHTML += `</div>`;
    }
    
    document.getElementById('fixturesList').innerHTML = fixturesHTML;
}

// ----------------------------------------------------
// EXPORT FUNCTIONS
// ----------------------------------------------------
function exportCSV() {
    let csvContent = "data:text/csv;charset=utf-8,Wave,Player 1,Player 2\n";
    matchesData.forEach(m => {
        csvContent += `${m.wave},${m.player1},${m.player2}\n`;
    });
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", `Tournament_${tid}_Schedule.csv`);
    document.body.appendChild(link);
    link.click();
}

function exportJSON() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(matchesData, null, 2));
    const link = document.createElement("a");
    link.setAttribute("href", dataStr);
    link.setAttribute("download", `Tournament_${tid}_Schedule.json`);
    document.body.appendChild(link);
    link.click();
}

function startMatch() {
    // Hapa utaweka logic ya ku-update 'start' iwe true kwenye match inayomhusu currentUser kwa Wave husika
    alert("Kitufe cha kuanza kipo tayari! Hapa tutaunganisha na game moja kwa moja au ku-update status ya match.");
}

// Initialize Board
window.onload = loadBoard;
</script>
</body>
</html>
