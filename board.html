// ----------------------------------------------------
// ROUND ROBIN ALGORITHM (Circle Method) & DATABASE SYNC
// ----------------------------------------------------
async function processRoundRobinMatches() {
    // Check if matches already generated in DB
    const { data: existingMatches, error } = await sb.from('Tournaments_matches').select('*').eq('tournament_id', tid).order('wave', { ascending: true });
    
    if (existingMatches && existingMatches.length > 0) {
        matchesData = existingMatches;
        calculateStats(participantsData.length);
        displaySchedule();
        return;
    }

    // If no matches, GENERATE them strictly following formulas
    let players = participantsData.map(p => p.player_name);
    let n = players.length;
    
    if (n % 2 !== 0) {
        players.push("BYE");
        n++;
    }

    const totalWaves = n - 1;
    const half = n / 2;
    const newMatches = [];

    // Berger Algorithm Generation
    let currentPlayers = [...players];
    for (let wave = 1; wave <= totalWaves; wave++) {
        for (let i = 0; i < half; i++) {
            let p1 = currentPlayers[i];
            let p2 = currentPlayers[n - 1 - i];
            
            // Validate: No Bye vs Bye
            if (p1 !== "BYE" && p2 !== "BYE") {
                newMatches.push({
                    tournament_id: tid,
                    player1: p1,
                    player2: p2,
                    wave: wave,
                    start: false
                });
            }
        }
        // Rotate (keep index 0 fixed, shift others)
        currentPlayers.splice(1, 0, currentPlayers.pop());
    }

    // Insert into Supabase
    const { data: insertedData, error: insertErr } = await sb.from('Tournaments_matches').insert(newMatches).select();
    
    if (insertErr) {
        console.error("Failed to save matches:", insertErr);
        document.getElementById('statusMsg').innerText = "Kuna tatizo kuokoa ratiba kwenye mfumo.";
    } else {
        matchesData = insertedData;
        calculateStats(participantsData.length);
        displaySchedule();
    }
}

function calculateStats(N) {
    let isOdd = N % 2 !== 0;
    let logicalN = isOdd ? N + 1 : N;
    
    statsInfo = {
        totalPlayers: N,
        totalWaves: logicalN - 1,
        matchesPerWave: isOdd ? (N - 1) / 2 : N / 2,
        totalMatches: (N * (N - 1)) / 2,
        matchesPerPlayer: N - 1
    };
}

function displaySchedule() {
    document.getElementById('scheduleSection').style.display = 'block';

    // 1. Render Stats Grid
    document.getElementById('statsGrid').innerHTML = `
        <div class="stat-card"><h4>Total Players</h4><span>${statsInfo.totalPlayers}</span></div>
        <div class="stat-card"><h4>Total Waves</h4><span>${statsInfo.totalWaves}</span></div>
        <div class="stat-card"><h4>Matches/Wave</h4><span>${statsInfo.matchesPerWave}</span></div>
        <div class="stat-card"><h4>Total Matches</h4><span>${statsInfo.totalMatches}</span></div>
        <div class="stat-card"><h4>Matches/Player</h4><span>${statsInfo.matchesPerPlayer}</span></div>
    `;

    // 2. Render Waves (Fixtures)
    const groupedByWave = {};
    matchesData.forEach(m => {
        if (!groupedByWave[m.wave]) groupedByWave[m.wave] = [];
        groupedByWave[m.wave].push(m);
    });

    let fixturesHTML = "";
    for (let wave in groupedByWave) {
        fixturesHTML += `<div class="wave-container">
            <h3 class="wave-title">Wave ${wave}</h3>`;
        
        groupedByWave[wave].forEach(match => {
            let isMyMatch = (match.player1 === currentUser || match.player2 === currentUser);
            let highlight = isMyMatch ? 'style="color: #a020f0; font-weight: bold;"' : '';
            fixturesHTML += `
                <div class="fixture" ${highlight}>
                    <span>${match.player1}</span>
                    <span>VS</span>
                    <span>${match.player2}</span>
                </div>`;
        });
        fixturesHTML += `</div>`;
    }
    
    document.getElementById('fixturesList').innerHTML = fixturesHTML;
}

       } else {

async function awardJudgePoints() {
    const currentMatch = matchState.userMatches[matchState.currentMatchIndex];
    const msg = document.getElementById('statusMsg');
    
    let player1Points = 0;
    let player2Points = 0;
    let resultMsg = "";

    // ===== LOGIC: WHO CLICKED? =====
    if (matchState.player1Clicked && matchState.player2Clicked) {
        // Both clicked - play normally
        resultMsg = "✅ Wote wabonyeza! Michezo itaanza...";
        // Proceed to game normally
        setTimeout(() => {
            window.location.href = `start.html?match_id=${currentMatch.id}`;
        }, 2000);
        return;
    } 
    else if (matchState.player1Clicked && !matchState.player2Clicked) {
        // Player 1 clicked, Player 2 delayed
        player1Points = 3;
        player2Points = 0;
        resultMsg = `⚠️ ${currentMatch.player2} akachelewa! ${currentMatch.player1} kupata 3 pointi, ${currentMatch.player2} 0 pointi.`;
    } 
    else if (!matchState.player1Clicked && matchState.player2Clicked) {
        // Player 2 clicked, Player 1 delayed
        player1Points = 0;
        player2Points = 3;
        resultMsg = `⚠️ ${currentMatch.player1} akachelewa! ${currentMatch.player2} kupata 3 pointi, ${currentMatch.player1} 0 pointi.`;
    } 
    else {
        // Both delayed - Drawer
        player1Points = 1;
        player2Points = 1;
        resultMsg = "🤝 Wote wachelewa - Drawer! Kila mmoja kupata 1 point.";
    }

    msg.innerText = resultMsg;
    console.log(resultMsg);

    // ===== UPDATE DATABASE WITH JUDGE'S DECISION =====
    const { error } = await sb
        .from('Tournaments_matches')
        .update({
            player1_points: player1Points,
            player2_points: player2Points,
            judge_decision: true,
            result: `${player1Points}-${player2Points}`, // Walipomia
            completed: true,  // ⬅️ Mark as played
            completed_at: new Date().toISOString(),  // ⬅️ Timestamp
            status: 'finished'  // ⬅️ Status
        })
        .eq('id', currentMatch.id);

    if (error) {
        console.error("Tatizo kusave judge decision:", error);
    }

    // ===== UPDATE LEADERBOARD =====
    const isPlayer1Winner = player1Points > player2Points;
    const isPlayer2Winner = player2Points > player1Points;
    
    console.log(`📊 Saving Round Robin Stats for Match: ${currentMatch.player1} vs ${currentMatch.player2}`);
    
    const p1SaveSuccess = await updatePlayerPoints(currentMatch.player1, player1Points, isPlayer1Winner);
    const p2SaveSuccess = await updatePlayerPoints(currentMatch.player2, player2Points, isPlayer2Winner);

    if (p1SaveSuccess && p2SaveSuccess) {
        console.log(`✅ Both players data saved successfully!`);
    } else {
        console.error(`❌ Error saving one or both players`);
    }
    
    // ===== COUNTDOWN NEXT MATCH =====
    setTimeout(() => {
        countdownNextMatch();
    }, 4000);
}

async function updatePlayerPoints(playerName, points, isWinner = false) {
    try {
        // ===== STEP 1: GET PARTICIPANT DATA =====
        const { data: participant, error: fetchErr } = await sb
            .from('tornamenents_participants')
            .select('*')
            .eq('tournament_id', tid)
            .eq('player_name', playerName)
            .single();

        if (fetchErr || !participant) {
            console.error("❌ Tatizo kupata participant:", playerName);
            return false;
        }

        // ===== STEP 2: GET USER_ID IF NOT SAVED =====
        let userId = participant.user_id;
        
        if (!userId) {
            const { data: userProfile } = await sb
                .from('user_profile')
                .select('id')
                .eq('username', playerName)
                .single();
            
            if (userProfile) {
                userId = userProfile.id;
            }
        }

        // ===== STEP 3: CALCULATE NEW STATS =====
        let newStats = {
            tournament_id: tid,  // ⬅️ MUST HAVE
            user_id: userId,      // ⬅️ MUST HAVE
            player_name: playerName,
            p: (participant.p || 0) + 1,  // Matches played
            pts: (participant.pts || 0) + points,
            updated_at: new Date().toISOString()
        };

        // ===== STEP 4: ADD WIN STATS =====
        if (isWinner && points === 3) {
            newStats.w = (participant.w || 0) + 1;      // Wins
            newStats.d = (participant.d || 0);          // Keep draws same
            newStats.l = (participant.l || 0);          // Keep losses same
            newStats.gf = (participant.gf || 0) + 3;    // Goals for
            newStats.ga = (participant.ga || 0) + 0;    // Goals against
            newStats.gd = (newStats.gf - newStats.ga);  // Goal difference
            
            console.log(`⚡ WINNER: ${playerName}`);
            console.log(`  W: ${newStats.w} | D: ${newStats.d} | L: ${newStats.l}`);
            console.log(`  GF: ${newStats.gf} | GA: ${newStats.ga} | GD: ${newStats.gd}`);
            console.log(`  P: ${newStats.p} | Pts: ${newStats.pts}`);
        }
        // ===== STEP 5: ADD LOSS STATS =====
        else if (!isWinner && points === 0) {
            newStats.w = (participant.w || 0);          // Keep wins same
            newStats.d = (participant.d || 0);          // Keep draws same
            newStats.l = (participant.l || 0) + 1;      // Losses
            newStats.gf = (participant.gf || 0) + 0;    // Goals for
            newStats.ga = (participant.ga || 0) + 3;    // Goals against
            newStats.gd = (newStats.gf - newStats.ga);  // Goal difference
            
            console.log(`❌ LOSER: ${playerName}`);
            console.log(`  W: ${newStats.w} | D: ${newStats.d} | L: ${newStats.l}`);
            console.log(`  GF: ${newStats.gf} | GA: ${newStats.ga} | GD: ${newStats.gd}`);
            console.log(`  P: ${newStats.p} | Pts: ${newStats.pts}`);
        }
        // ===== STEP 6: ADD DRAW STATS =====
        else if (points === 1) {
            newStats.w = (participant.w || 0);          // Keep wins same
            newStats.d = (participant.d || 0) + 1;      // Draws
            newStats.l = (participant.l || 0);          // Keep losses same
            newStats.gf = (participant.gf || 0) + 1;    // Goals for
            newStats.ga = (participant.ga || 0) + 1;    // Goals against
            newStats.gd = (newStats.gf - newStats.ga);  // Goal difference
            
            console.log(`🤝 DRAWER: ${playerName}`);
            console.log(`  W: ${newStats.w} | D: ${newStats.d} | L: ${newStats.l}`);
            console.log(`  GF: ${newStats.gf} | GA: ${newStats.ga} | GD: ${newStats.gd}`);
            console.log(`  P: ${newStats.p} | Pts: ${newStats.pts}`);
        }

        // ===== STEP 7: UPDATE DATABASE =====
        const { data: updatedData, error: updateErr } = await sb
            .from('tornamenents_participants')
            .update(newStats)
            .eq('id', participant.id)
            .select();

        if (updateErr) {
            console.error("❌ Tatizo ku-update stats:", updateErr);
            return false;
        }

        // ===== STEP 8: VERIFY DATA SAVED =====
        console.log(`✅ ${playerName} Data Saved:`);
        console.log(`  tournament_id: ${newStats.tournament_id}`);
        console.log(`  user_id: ${newStats.user_id}`);
        console.log(`  P: ${newStats.p} | W: ${newStats.w} | D: ${newStats.d} | L: ${newStats.l}`);
        console.log(`  GF: ${newStats.gf} | GA: ${newStats.ga} | GD: ${newStats.gd}`);
        console.log(`  PTS: ${newStats.pts}`);

        return true;

    } catch (err) {
        console.error("❌ Error updating player points:", err);
        return false;
    }
}

function countdownNextMatch() {
    const btn = document.getElementById('startBtn');
    const msg = document.getElementById('statusMsg');

    // Ikiwa kuna match nyingine
    if (matchState.currentMatchIndex + 1 < matchState.userMatches.length) {
        matchState.currentMatchIndex++;
        matchState.timeRemaining = 300;
        matchState.hasJoined = false;
        matchState.windowClosed = false;

        const nextMatch = matchState.userMatches[matchState.currentMatchIndex];
        const opponent = nextMatch.player1 === currentUser ? nextMatch.player2 : nextMatch.player1;
        
        msg.innerText = `📋 Mchezo ujao itakuwa karibu... Mkutano unaokuja: VS ${opponent}`;
        
        // Kisha, baada ya 5 sekunde, window inayofunguliwa tena
        setTimeout(() => {
            initMatchWindow();
        }, 5000);
    } else {
        btn.innerText = "✅ MATANGAZO YOTE YAMEISHIA";
        msg.innerText = "🎉 Umemalizana na matangazo yako yote!";
    }
}

async function checkRoundRobinCompletion() {
    try {
        // ===== STEP 1: Pata laini zote za ROUND ROBIN (sivyo knockout) =====
        const { data: allMatches, error } = await sb
            .from('Tournaments_matches')
            .select('*')
            .eq('tournament_id', tid)
            .neq('stage', 'knockout'); // Exclude knockout matches

        if (error) {
            console.error("Tatizo kucheck laini:", error);
            return false;
        }

        // ===== STEP 2: Count TOTAL ROUND ROBIN MATCHES =====
        const totalRRMatches = allMatches.length;
        console.log(`📊 Total Round Robin Matches: ${totalRRMatches}`);

        if (totalRRMatches === 0) {
            console.log("❌ Hakuna Round Robin matches!");
            return false;
        }

        // ===== STEP 3: CRITICAL - Check kama laini ZOTE zimekamilika =====
        // Laini imemaliza = ina RESULT (score) na start=true
        const completedMatches = allMatches.filter(m => {
            return m.start === true && m.result !== null && m.result !== '';
        }).length;

        console.log(`✅ Completed Matches: ${completedMatches}/${totalRRMatches}`);

        // ===== STEP 4: BUTTON LOGIC =====
        // BUTTON ITAONEKANA ONLY IKI: completedMatches === totalRRMatches
        if (completedMatches === totalRRMatches && totalRRMatches > 0) {
            console.log("🎉 ROUND ROBIN IMEKAMILIKA!");
            roundRobinState.isComplete = true;
            
            // Pata players wa top 8/16 na check tiebreaker
            await getQualifiedPlayers();
            
            // ===== TIEBREAKER CHECK =====
            if (roundRobinState.needsTiebreaker) {
                console.log("⚠️ Tiebreaker matches inakwisha, button haiwezi tokea!");
                // Button itabaki hidden. Playoff matches zimekuwepo
                return false;
            } else {
                console.log("✅ Walakini hakuna tiebreaker - safe to proceed!");
                // Onyesha knockout button
                showKnockoutButton();
                return true;
            }
        } else {
            console.log(`⏳ Laini bado inakwisha: ${totalRRMatches - completedMatches} matches zimebaki`);
            // Keep button hidden hangika laini zote zimekamilika
            hideKnockoutButton();
            return false;
        }

    } catch (err) {
        console.error("❌ Error checking round robin:", err);
        return false;
    }
}

async function getQualifiedPlayers() {
    // Pata leaderboard na tukuchukua top players
    const { data: leaderboard, error } = await sb
        .from('tornamenents_participants')
        .select('player_name, pts, gd, gf')
        .eq('tournament_id', tid)
        .order('pts', { ascending: false })
        .order('gd', { ascending: false })
        .order('gf', { ascending: false });

    if (error) {
        console.error("Tatizo kupata leaderboard:", error);
        return;
    }

    // ===== STEP 1: Determine qualification spots =====
    let qualificationSpots = 8; // Default single knockout
    let tiebreakPosition = 9;

    if (tournamentData.knockout_type === 'double' || tournamentData.max_players >= 16) {
        qualificationSpots = 16;
        tiebreakPosition = 17;
    }

    console.log(`📊 Knockout Type: ${tournamentData.knockout_type}, Spots: ${qualificationSpots}`);

    // ===== STEP 2: Pata qualified players =====
    const qualifiedPlayers = leaderboard.slice(0, qualificationSpots);
    
    // ===== STEP 3: CHECK TIEBREAKER =====
    // Ikiwa player #qualificationSpots (index = qualificationSpots-1) == player #tiebreakPosition (index = tiebreakPosition-1)
    if (leaderboard[qualificationSpots - 1] && leaderboard[tiebreakPosition - 1]) {
        const lastQualified = leaderboard[qualificationSpots - 1];
        const firstNotQualified = leaderboard[tiebreakPosition - 1];

        // Check ikiwa wana POINTS sawa
        if (lastQualified.pts === firstNotQualified.pts) {
            console.log(`⚠️ TIE DETECTED: Position ${qualificationSpots} vs ${tiebreakPosition}`);
            console.log(`Points: ${lastQualified.pts} == ${firstNotQualified.pts}`);

            // Find all players wana points sawa
            const tiedPlayers = leaderboard.filter(p => p.pts === lastQualified.pts);
            
            console.log(`🎯 Players with tied points: ${tiedPlayers.length}`);
            console.log("Tied players:", tiedPlayers.map(p => p.player_name));

            // Mark tiebreaker needed
            roundRobinState.needsTiebreaker = true;
            roundRobinState.tieplayersCount = tiedPlayers.length;

            // Generate playoff matches kwa tied players
            await generatePlayoffMatches(tiedPlayers);

            return; // BUTTON HAIWEZI TOKEA! Wait for playoff
        }
    }

    // ===== NO TIE - SAFE TO PROCEED =====
    roundRobinState.needsTiebreaker = false;
    roundRobinState.qualifiedPlayers = qualifiedPlayers;
    
    console.log("✅ NO TIEBREAKER NEEDED! Top players qualified:");
    console.log(roundRobinState.qualifiedPlayers.map(p => `${p.player_name}: ${p.pts}pts`));
}

async function generatePlayoffMatches(tiedPlayers) {
    console.log(`🎯 Generating playoff matches for ${tiedPlayers.length} tied players...`);

    const msg = document.getElementById('statusMsg');
    msg.innerText = `⚠️ Kuna ufanano wa points! Playoff matches inaanzwa...`;

    // Sort by head-to-head, then GD, then GF (if needed)
    let playoffMatches = [];

    // Ikiwa 2 tu wanafanana → 1 match
    if (tiedPlayers.length === 2) {
        playoffMatches.push({
            tournament_id: tid,
            player1: tiedPlayers[0].player_name,
            player2: tiedPlayers[1].player_name,
            wave: `PLAYOFF-${tiedPlayers[0].pts}pts`,
            stage: 'playoff',
            start: false,
            playoff_group: 'tie-breaker'
        });
    }
    // Ikiwa 3+ wanafanana → Round robin kati yao
    else if (tiedPlayers.length > 2) {
        for (let i = 0; i < tiedPlayers.length; i++) {
            for (let j = i + 1; j < tiedPlayers.length; j++) {
                playoffMatches.push({
                    tournament_id: tid,
                    player1: tiedPlayers[i].player_name,
                    player2: tiedPlayers[j].player_name,
                    wave: `PLAYOFF-${tiedPlayers[0].pts}pts`,
                    stage: 'playoff',
                    start: false,
                    playoff_group: 'tie-breaker'
                });
            }
        }
    }

    // Insert playoff matches
    const { data: insertedPlayoffs, error } = await sb
        .from('Tournaments_matches')
        .insert(playoffMatches)
        .select();

    if (error) {
        console.error("❌ Tatizo kugenerate playoff:", error);
        msg.innerText = `❌ Tatizo kuanzisha playoff: ${error.message}`;
        return;
    }

    console.log("✅ Playoff matches generated:", insertedPlayoffs);
    msg.innerText = `📋 Playoff matches ready! Wacheza na kisha Knockout itakuja...`;
    
    // ===== KUONGEZA: CREATE TIMETABLE ENTRY FOR PLAYOFF =====
    await createPlayoffTimetable(tiedPlayers.length);
    
    // Hide knockout button - it will show baada ya playoff kumaliza
    hideKnockoutButton();
}

async function createPlayoffTimetable(numPlayers) {
    try {
        // Calculate playoff wave number
        const totalWaves = matchesData.length > 0 ? 
            Math.max(...matchesData.map(m => m.wave || 1)) : 1;
        
        const playoffWaveNumber = totalWaves + 1;
        
        // Create timetable entry with extra time buffer
        // Add 30 minutes from now for playoff to start
        const playoffStartTime = new Date(Date.now() + (30 * 60 * 1000)).toISOString();

        const { data: timetableEntry, error } = await sb
            .from('timetable')
            .insert({
                tournament_id: tid,
                match_name: `Match ${playoffWaveNumber}`,  // Treat as normal wave
                start_time: playoffStartTime,
                wave_type: 'playoff',
                created_at: new Date().toISOString()
            })
            .select();

        if (error) {
            console.error("❌ Tatizo kuadd playoff timetable:", error);
            return false;
        }

        console.log(`✅ Playoff Timetable Entry Created:`);
        console.log(`  Wave: ${playoffWaveNumber}`);
        console.log(`  Start Time: ${new Date(playoffStartTime).toLocaleString()}`);
        
        // ===== ACTIVATE PLAYOFF WAVE IN TIMETABLE =====
        timetableState.currentWaveNumber = playoffWaveNumber;
        await loadTimetable();  // Load playoff timetable like normal wave

        return true;

    } catch (err) {
        console.error("❌ Error creating playoff timetable:", err);
        return false;
    }
}

async function checkPlayoffCompletion() {
    // Checkia kama playoff matches zimekamilika
    const { data: playoffMatches, error } = await sb
        .from('Tournaments_matches')
        .select('*')
        .eq('tournament_id', tid)
        .eq('stage', 'playoff');

    if (error || !playoffMatches || playoffMatches.length === 0) {
        return false;
    }

    // Count completed playoff matches
    const completedPlayoffs = playoffMatches.filter(m => 
        m.result !== null && m.result !== ''
    ).length;

    console.log(`Playoff matches: ${completedPlayoffs}/${playoffMatches.length}`);

    // Ikiwa playooffs zimekamilika
    if (completedPlayoffs === playoffMatches.length) {
        console.log("✅ Playoff matches zimekamilika! Updating qualified players...");
        
        // Re-fetch leaderboard
        const { data: leaderboard } = await sb
            .from('tornamenents_participants')
            .select('player_name, pts, gd, gf')
            .eq('tournament_id', tid)
            .order('pts', { ascending: false })
            .order('gd', { ascending: false })
            .order('gf', { ascending: false });

        // Set qualified players (recount)
        let qualificationSpots = 8;
        if (tournamentData.knockout_type === 'double' || tournamentData.max_players >= 16) {
            qualificationSpots = 16;
        }

        roundRobinState.qualifiedPlayers = leaderboard.slice(0, qualificationSpots);
        roundRobinState.needsTiebreaker = false;

        // ===== MOVE TO KNOCKOUT AFTER PLAYOFF =====
        console.log("🎯 Playoff complete! Preparing for Knockout...");
        
        // Check if there are more waves or go straight to knockout
        const totalWaves = matchesData.length > 0 ? 
            Math.max(...matchesData.map(m => m.wave || 1)) : 1;

        const playoffWaveNumber = timetableState.currentWaveNumber;

        if (playoffWaveNumber >= totalWaves) {
            // No more regular waves after playoff
            showKnockoutButton();
        } else {
            // There are more waves, move to next
            await moveToNextWave();
        }
        
        return true;
    }

    return false;
}

    const knockoutBtn = document.getElementById('knockoutBtn');

function hideKnockoutButton() {
    const knockoutBtn = document.getElementById('knockoutBtn');
    const knockoutMsg = document.getElementById('knockoutMsg');
    const startBtn = document.getElementById('startBtn');

    // Hide knockout button, show start button
    knockoutBtn.style.display = 'none';

async function startKnockout() {
    const knockoutBtn = document.getElementById('knockoutBtn');
    const knockoutMsg = document.getElementById('knockoutMsg');

    if (!roundRobinState.isComplete) {
        alert("❌ Round Robin haijamkamilika bado!");
        return;
    }

    if (roundRobinState.knockoutStarted) {
        alert("⚠️ Knockout stage tayari imeanza!");
        return;
    }

    // ===== STEP 1: GET SUBFORMAT FROM TOURNAMENT DATA =====
    const subformat = tournamentData.subformat || 'single knockout';
    console.log(`🎯 Tournament Subformat: ${subformat}`);

    // Confirm action
    const confirmed = confirm(
        `🏆 Anza Knockout Stage?\n\n` +
        `Players qualified: ${roundRobinState.qualifiedPlayers.length}\n` +
        `Format: ${subformat}\n` +
        `Hii haiwezi kurudishwa!`
    );

    if (!confirmed) return;

    // Disable button kwa sababu action ni final
    knockoutBtn.disabled = true;
    knockoutBtn.innerText = "⏳ KUANZISHA KNOCKOUT...";

    try {
        // 1. Generate knockout brackets
        await generateKnockoutBrackets();

        // 2. Update tournament status
        await sb
            .from('tournaments')
            .update({ stage: 'knockout' })
            .eq('id', tid);

        // 3. Update state
        roundRobinState.knockoutStarted = true;

        // 4. Update UI
        knockoutBtn.innerText = "✅ KNOCKOUT IMEANZA!";
        knockoutMsg.innerText = "🎉 Knockout stage imeanza! Kubwa zaidi inakuja...";

        // ===== STEP 2: REDIRECT BASED ON SUBFORMAT =====
        let knockoutPage = 'single_knockout.html';  // Default

        if (subformat.toLowerCase() === 'double knockout') {
            knockoutPage = 'double_knockout.html';
        } else if (subformat.toLowerCase() === 'single knockout') {
            knockoutPage = 'single_knockout.html';
        }

        console.log(`📄 Redirecting to: ${knockoutPage}`);

        // 5. Baada ya 2 sekunde, enda kwenye knockout page
        setTimeout(() => {
            window.location.href = `${knockoutPage}?tid=${tid}`;
        }, 2000);

    } catch (err) {
        console.error("Tatizo kuanza knockout:", err);
        knockoutBtn.disabled = false;
        knockoutBtn.innerText = "🏆 START KNOCKOUT STAGE";
        alert("❌ Tatizo kuanza Knockout: " + err.message);
    }
}

async function generateKnockoutBrackets() {
    // Semi-finals & Finals generation
    const qualified = roundRobinState.qualifiedPlayers;
    const knockoutMatches = [];

    // Pair players: 1 vs 8, 2 vs 7, 3 vs 6, 4 vs 5
    const semifinals = [
        { player1: qualified[0].player_name, player2: qualified[7].player_name, round: 1 },
        { player1: qualified[1].player_name, player2: qualified[6].player_name, round: 1 },
        { player1: qualified[2].player_name, player2: qualified[5].player_name, round: 1 },
        { player1: qualified[3].player_name, player2: qualified[4].player_name, round: 1 }
    ];

    // Insert semifinals kwenye table
    for (let match of semifinals) {
        const { error } = await sb.from('Tournaments_matches').insert({
            tournament_id: tid,
            player1: match.player1,
            player2: match.player2,
            wave: `SF-${match.round}`,
            stage: 'knockout',
            start: false
        });

        if (error) throw new Error("Tatizo kuanzisha brackets: " + error.message);
    }

    console.log("Knockout brackets ready:", semifinals);
}

async function startMatch() {
    if (!matchState.isActive || matchState.windowClosed) {
        alert("❌ Muda wa kujoin umekwisha kwa mchezo huu.");
        return;
    }

    const currentMatch = matchState.userMatches[matchState.currentMatchIndex];
    const opponent = currentMatch.player1 === currentUser ? currentMatch.player2 : currentMatch.player1;
    const isPlayer1 = currentMatch.player1 === currentUser;

    // ===== STEP 1: RECORD PLAYER CLICK TIME =====
    const clickTime = Date.now();
    
    if (isPlayer1) {
        matchState.player1Clicked = true;
        matchState.player1JoinTime = clickTime;
    } else {
        matchState.player2Clicked = true;
        matchState.player2JoinTime = clickTime;
    }

    console.log(`⏱️ ${currentUser} clicked START button`);

    // ===== STEP 2: CHECK IF BOTH PLAYERS JOINED =====
    const bothJoined = matchState.player1Clicked && matchState.player2Clicked;

    if (bothJoined) {
        // Both clicked - proceed normally
        await proceedToGame(currentMatch, opponent, 'both');
    } else {
        // Only one clicked - wait or proceed with points logic
        const msg = document.getElementById('statusMsg');
        msg.innerText = `⏳ Karibu kuanza... inayangoja ${opponent}...`;
    }
}

async function proceedToGame(match, opponent, scenario) {
    const btn = document.getElementById('startBtn');
    const msg = document.getElementById('statusMsg');

    // 1. Badilisha 'start' kuwa TRUE kwenye database
    const { error } = await sb
        .from('Tournaments_matches')
        .update({ start: true })
        .eq('id', match.id);

    if (error) {
        alert("❌ Tatizo kuanza mchezo: " + error.message);
        return;
    }

    // 2. Update button state
    matchState.hasJoined = true;
    btn.disabled = true;
    btn.style.background = '#00c853';
    btn.innerText = `✅ UMEJOIN | VS ${opponent}`;
    msg.innerText = `✅ Umejoin mchezo! Karibu ${opponent}...`;

    // 3. Clear timer
    if (matchState.timerInterval) clearInterval(matchState.timerInterval);

    // 4. Check round robin
    setTimeout(async () => {
        await checkRoundRobinCompletion();
    }, 5000);

    // 5. Redirect kwenye game page
    setTimeout(() => {
        window.location.href = `game.html?match_id=${match.id}`;
    }, 2000);
}
