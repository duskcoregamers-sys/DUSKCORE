<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <title>DUSKCORE - Chess.com Tournaments</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="duskcore logo.jpg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background: radial-gradient(circle at top, #1a1a1a, #000); color: white; padding-bottom: 80px; }
        h1, h2 { color: #a020f0; text-align: center; text-shadow: 0 0 15px rgba(160, 32, 240, 0.5); text-transform: uppercase; letter-spacing: 2px; }
        .category-title { background: rgba(160, 32, 240, 0.1); padding: 12px; text-align: center; border-top: 2px solid #a020f0; border-bottom: 2px solid #a020f0; margin-top: 30px; }
        .wallet-display { background: rgba(160, 32, 240, 0.08); border: 1px solid rgba(160, 32, 240, 0.4); border-radius: 10px; padding: 10px; max-width: 400px; margin: 15px auto; display: flex; justify-content: space-around; font-weight: bold; }
        .t-card { width: 92%; max-width: 500px; margin: 20px auto; border: 1px solid rgba(160, 32, 240, 0.4); border-radius: 12px; background: rgba(25, 25, 25, 0.95); box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; }
        .t-card img { width: 100%; height: 180px; object-fit: cover; border-bottom: 1px solid #a020f0; }
        .t-details { padding: 20px; }
        .badge { display: inline-block; background: #a020f0; color: white; padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-bottom: 12px; text-transform: uppercase; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 15px 0; }
        .info-box { background: rgba(160, 32, 240, 0.05); padding: 12px; border-radius: 8px; border: 1px solid rgba(160, 32, 240, 0.2); text-align: center; font-size: 14px; }
        .countdown { color: #ff3366; font-weight: bold; font-family: 'Courier New', monospace; font-size: 17px; }

        /* JOIN button - purple */
        .btn-join {
            display: block; width: 100%; padding: 15px;
            text-align: center; background: #a020f0; color: white;
            font-weight: bold; font-size: 15px; border: none;
            border-radius: 6px; cursor: pointer; transition: 0.3s;
            text-transform: uppercase; box-sizing: border-box;
            text-decoration: none;
        }
        .btn-join:hover { background: #bc3df5; box-shadow: 0 0 20px rgba(160, 32, 240, 0.5); }

        /* ENTER button - green */
        .btn-enter {
            display: block; width: 100%; padding: 15px;
            text-align: center; background: #00aa44; color: white;
            font-weight: bold; font-size: 15px; border: none;
            border-radius: 6px; cursor: pointer; transition: 0.3s;
            text-transform: uppercase; box-sizing: border-box;
            text-decoration: none;
        }
        .btn-enter:hover { background: #00cc55; box-shadow: 0 0 20px rgba(0, 200, 80, 0.5); }

        /* FULL button - grey */
        .btn-full {
            display: block; width: 100%; padding: 15px;
            text-align: center; background: #333; color: #777;
            font-weight: bold; font-size: 15px; border: none;
            border-radius: 6px; cursor: not-allowed;
            text-transform: uppercase; box-sizing: border-box;
        }

        /* LOADING button */
        .btn-loading {
            display: block; width: 100%; padding: 15px;
            text-align: center; background: #555; color: #ccc;
            font-weight: bold; font-size: 15px; border: none;
            border-radius: 6px; cursor: not-allowed;
            text-transform: uppercase; box-sizing: border-box;
        }

        .dashboard { position: fixed; bottom: 20px; right: 20px; padding: 15px 25px; background: #a020f0; color: white; border-radius: 50px; text-decoration: none; font-weight: bold; z-index: 1000; }
    </style>
</head>
<body>

<h1>🏆 CHESS.COM TOURNAMENTS</h1>

<div class="wallet-display">
    <span>🔴 Red: <span id="walletRed">...</span></span>
    <span>🔵 Blue: <span id="walletBlue">...</span></span>
    <span>🟣 Super: <span id="walletSuper">...</span></span>
</div>

<h2 class="category-title">🟢 ONGOING MATCHES</h2>
<div id="ongoingContainer"></div>

<h2 class="category-title">⏳ UPCOMING MATCHES</h2>
<div id="upcomingContainer"></div>

<a class="dashboard" href="dashboard.html">Dashboard</a>

<script>
const supabaseClient = supabase.createClient(
    "https://ldgnyehqrharqvynohla.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxkZ255ZWhxcmhhcnF2eW5vaGxhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMzgzMDcsImV4cCI6MjA5NDYxNDMwN30.80vZuD20je-8VKDJwoy7P2mFYqY9Vcq3nMd9K-pHYBI"
);

const dbColumns = { "Red Coins": 'red_coins', "Blue Coins": 'blue_coins', "Super Coins": 'super_coins' };
let currentUser = localStorage.getItem("dusk_username");
let activeTimers = [];

async function loadLiveWallet() {
    if (!currentUser) return;
    let { data: profile } = await supabaseClient.from('user_profile').select('*').eq('username', currentUser).single();
    if (profile) {
        document.getElementById("walletRed").innerText = profile.red_coins || 0;
        document.getElementById("walletBlue").innerText = profile.blue_coins || 0;
        document.getElementById("walletSuper").innerText = profile.super_coins || 0;
    }
}

async function loadTournaments() {
    activeTimers.forEach(clearInterval);
    activeTimers = [];
    let ongoingHTML = "", upcomingHTML = "", now = Date.now();

    // Pata tournaments za Chess
    let { data: tList } = await supabaseClient
        .from('tournaments')
        .select('*')
        .ilike('game', '%Chess%')
        .eq('isleague', false)
        .order('start_date', { ascending: true });

    // Pata tournaments ambazo current user ameshajoin
    let joinedSet = new Set();
    if (currentUser) {
        let { data: participated } = await supabaseClient
            .from('chess_participants')
            .select('tournament_id')
            .eq('username', currentUser);
        if (participated) participated.forEach(p => joinedSet.add(p.tournament_id));
    }

    if (!tList || tList.length === 0) {
        document.getElementById("ongoingContainer").innerHTML = "<p style='text-align:center'>Hakuna.</p>";
        document.getElementById("upcomingContainer").innerHTML = "<p style='text-align:center'>Hakuna.</p>";
        return;
    }

    tList.forEach((t) => {
        let startMs = new Date(t.start_date).getTime();
        let expireMs = new Date(t.end_date).getTime();
        if (now > expireMs) return;

        let joinedCount = t.joined || 0;
        let maxPlayers = t.max_players || 16;
        let isFull = joinedCount >= maxPlayers;
        let isOngoing = now >= startMs;
        let hasJoined = joinedSet.has(t.id);

        let imageSrc = t.image_url ? t.image_url : "https://images.unsplash.com/photo-1528819622765-d6bcf132f793?w=500";

        // Button: kama amejoin → kijani (ENTER), kama full → grey, kama hajajoin → purple (JOIN)
        let btnHTML = "";
        if (hasJoined) {
            // ✅ MABADILIKO: Ipasse tournament_id kwa URL
            btnHTML = `<a href="chessboard.html?tournament_id=${t.id}" class="btn-enter">♟️ ENTER TOURNAMENT</a>`;
        } else if (isFull) {
            btnHTML = `<button class="btn-full" disabled>❌ FULL</button>`;
        } else {
            btnHTML = `<button class="btn-join" id="btn_${t.id}" onclick="joinTournament(${t.id}, ${t.fee_amount}, '${t.fee_type}', '${t.title.replace(/'/g, "\\'")}')">JOIN TOURNAMENT</button>`;
        }

        let card = `
        <div class="t-card">
            <img src="${imageSrc}" alt="${t.title}">
            <div class="t-details">
                <span class="badge">CHESS - ${t.format.toUpperCase()}</span>
                <h3>${t.title}</h3>
                <p>${t.description || ""}</p>
                <div class="info-grid">
                    <div class="info-box"><b>FEE</b><br>${t.fee_amount} ${t.fee_type}</div>
                    <div class="info-box"><b>STATUS</b><br>${joinedCount}/${maxPlayers}</div>
                </div>
                ${!isOngoing
                    ? `<div style="text-align:center;margin-bottom:12px">Starts in: <span class="countdown" id="cd_start_${t.id}">Loading...</span></div>`
                    : `<div style="text-align:center;margin-bottom:12px">▶️ ONGOING</div>`
                }
                <div id="btnWrapper_${t.id}">${btnHTML}</div>
            </div>
        </div>`;

        isOngoing ? ongoingHTML += card : upcomingHTML += card;
        if (now < startMs) startCountdown("cd_start_" + t.id, startMs);
    });

    document.getElementById("ongoingContainer").innerHTML = ongoingHTML || "<p style='text-align:center'>Hakuna.</p>";
    document.getElementById("upcomingContainer").innerHTML = upcomingHTML || "<p style='text-align:center'>Hakuna.</p>";
}

function startCountdown(elementId, targetTime) {
    let interval = setInterval(() => {
        let diff = targetTime - Date.now();
        if (diff <= 0) { clearInterval(interval); loadTournaments(); }
        else {
            let h = Math.floor(diff / (1000 * 60 * 60));
            let m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            let s = Math.floor((diff % (1000 * 60)) / 1000);
            let el = document.getElementById(elementId);
            if (el) el.innerText = `${h}h ${m}m ${s}s`;
        }
    }, 1000);
    activeTimers.push(interval);
}

async function joinTournament(tId, fee, coinType, title) {
    if (!currentUser) { alert("Tafadhali login kwanza!"); return; }
    if (!confirm(`Jiunge na "${title}"?\nFee: ${fee} ${coinType}`)) return;

    // Onyesha loading kwenye button
    let wrapper = document.getElementById("btnWrapper_" + tId);
    if (wrapper) wrapper.innerHTML = `<button class="btn-loading" disabled>⏳ LOADING...</button>`;

    try {
        // 1. Pata profile ya user
        let { data: profile, error: profileErr } = await supabaseClient
            .from('user_profile')
            .select('*')
            .eq('username', currentUser)
            .single();

        if (profileErr || !profile) throw new Error("Profile haipatikani");

        // 2. Angalia salio
        let targetCol = dbColumns[coinType];
        if (profile[targetCol] < fee) {
            alert("❌ Salio halitoshi!");
            // Rejesha button
            if (wrapper) wrapper.innerHTML = `<button class="btn-join" onclick="joinTournament(${tId}, ${fee}, '${coinType}', '${title.replace(/'/g, "\\'")}')">JOIN TOURNAMENT</button>`;
            return;
        }

        // 3. Punguza coins
        let { error: deductErr } = await supabaseClient
            .from('user_profile')
            .update({ [targetCol]: profile[targetCol] - fee })
            .eq('username', currentUser);

        if (deductErr) throw new Error("Imeshindwa kupunguza coins");

        // 4. Ongeza joined count kwenye tournament
        let { data: tData } = await supabaseClient
            .from('tournaments')
            .select('joined')
            .eq('id', tId)
            .single();

        await supabaseClient
            .from('tournaments')
            .update({ joined: (tData.joined || 0) + 1 })
            .eq('id', tId);

        // 5. Register user kwenye chess_participants
        let { error: insertErr } = await supabaseClient
            .from('chess_participants')
            .insert({
                tournament_id: tId,
                username: currentUser,
                games_played: 0,
                points: 0
            });

        if (insertErr) throw new Error("Imeshindwa kuregister: " + insertErr.message);

        // 6. Button inabadilika kuwa kijani (ENTER TOURNAMENT) - bila reload
        if (wrapper) {
            wrapper.innerHTML = `<a href="chessboard.html?tournament_id=${tId}" class="btn-enter">♟️ ENTER TOURNAMENT</a>`;
        }

        // Update wallet display
        loadLiveWallet();

    } catch(err) {
        alert("❌ Error: " + err.message);
        // Rejesha button kama kuna error
        if (wrapper) wrapper.innerHTML = `<button class="btn-join" onclick="joinTournament(${tId}, ${fee}, '${coinType}', '${title.replace(/'/g, "\\'")}')">JOIN TOURNAMENT</button>`;
    }
}

window.onload = () => {
    loadLiveWallet();
    loadTournaments();
};
</script>
</body>
</html>
