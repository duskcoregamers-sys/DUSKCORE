<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>DUSKCORE - Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="duskcore logo.jpg">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: radial-gradient(circle at top, #0a0a0a, #000);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      width: 340px;
      padding: 25px;
      border-radius: 15px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(160,32,240,0.4);
      box-shadow: 0 0 20px rgba(160,32,240,0.4);
      text-align: center;
      box-sizing: border-box;
    }

    .logo {
      width: 100px;
      border-radius: 15px;
      box-shadow: 0 0 15px #a020f0;
      margin-bottom: 10px;
    }

    h2 {
      color: #a020f0;
      text-shadow: 0 0 10px #a020f0;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #333;
      background: #000;
      color: white;
      outline: none;
      box-sizing: border-box;
    }

    input:focus {
      border-color: #a020f0;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: #a020f0;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      color: black;
      box-shadow: 0 0 15px #a020f0;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
    }

    .note {
      font-size: 12px;
      opacity: 0.7;
      margin-top: 15px;
      line-height: 1.4;
    }

    a {
      color: #a020f0;
      text-decoration: none;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="box">

  <img src="duskcore logo.jpg" class="logo">

  <h2>Login to DUSKCORE</h2>

  <input type="email" id="email" placeholder="Email Address">
  <input type="password" id="password" placeholder="Password">

  <button id="loginBtn" onclick="login()">Login</button>

  <p class="note">
    After login, you may be required to verify your email before accessing the dashboard.
  </p>

  <p style="font-size: 14px; margin-top: 15px;">
    Don't have an account? <a href="signup.html">Sign Up</a>
  </p>

</div>

<script>
const supabaseUrl = "https://ldgnyehqrharqvynohla.supabase.co";
const supabaseAnonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxkZ255ZWhxcmhhcnF2eW5vaGxhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMzgzMDcsImV4cCI6MjA5NDYxNDMwN30.80vZuD20je-8VKDJwoy7P2mFYqY9Vcq3nMd9K-pHYBI";
const supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey);

async function login(){
  let email = document.getElementById("email").value.trim();
  let password = document.getElementById("password").value;
  let btn = document.getElementById("loginBtn");

  if(email === "" || password === ""){
    alert("Please fill all fields");
    return;
  }

  btn.innerText = "Authenticating...";
  btn.disabled = true;

  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password,
    });

    if (error) throw error;

    // Vuta username kutoka user_metadata (iliyowekwa wakati wa signup)
    const metaUsername = data.user.user_metadata?.username;

    // Fetch profile kwa username
    let { data: profile } = await supabaseClient
        .from('user_profile')
        .select('username, avatar_url')
        .eq('username', metaUsername)
        .single();
        
    let finalUsername = profile ? profile.username : (metaUsername || email.split('@')[0]);
    
    if (profile && profile.avatar_url) {
        localStorage.setItem("dusk_profile_pic", profile.avatar_url);
    }

    localStorage.setItem("dusk_username", finalUsername);

    alert("Login Successful! Welcome, " + finalUsername);
    window.location.href = "dashboard.html";

  } catch (err) {
    alert("Login Failed: " + err.message);
  } finally {
    btn.innerText = "Login";
    btn.disabled = false;
  }
}
</script>

</body>
</html>
