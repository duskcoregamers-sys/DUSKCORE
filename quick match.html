<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>DUSKCORE - Quick Match</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Supabase Library SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      background: radial-gradient(circle at center, #160226, #000000);
      background-attachment: fixed;
      color: #a020f0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }

    h2 {
      text-shadow: 0 0 15px #a020f0;
      font-size: 2.2rem;
      letter-spacing: 4px;
      margin: 0 0 5px 0;
      text-transform: uppercase;
    }

    .user-welcome {
      font-size: 13px;
      color: #00ff88;
      margin-bottom: 20px;
      font-weight: bold;
      font-family: monospace;
      letter-spacing: 2px;
      text-shadow: 0 0 8px rgba(0, 255, 136, 0.6);
    }

    .box {
      width: 90%;
      max-width: 380px;
      padding: 25px 20px;
      border: 1px solid rgba(160, 32, 240, 0.5);
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(160, 32, 240, 0.2);
      background: rgba(17, 17, 22, 0.85);
      backdrop-filter: blur(10px);
      box-sizing: border-box;
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 10px;
      border: 1px solid #25252b;
      background: #16161a;
      color: white;
      outline: none;
      box-sizing: border-box;
      transition: 0.3s;
      font-size: 14px;
    }
    
    input:focus, select:focus {
      border-color: #a020f0;
      box-shadow: 0 0 10px rgba(160, 32, 240, 0.3);
    }

    button {
      padding: 12px;
      margin-top: 10px;
      background: #a020f0;
      border: none;
      color: white;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      transition: 0.3s;
      font-size: 14px;
      letter-spacing: 1px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 15px #a020f0;
    }

    .searching-box {
      margin-top: 20px;
      padding: 15px;
      border: 1px dashed rgba(160, 32, 240, 0.4);
      border-radius: 12px;
      background: rgba(160, 32, 240, 0.05);
      display: none;
    }

    .searching-box p {
      color: #ccc;
      font-family: monospace;
      font-size: 13px;
      margin: 10px 0 0 0;
      letter-spacing: 1px;
    }

    .spinner {
      width: 30px;
      height: 30px;
      margin: 0 auto;
      border: 3px solid rgba(160, 32, 240, 0.2);
      border-top: 3px solid #a020f0;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .opponent-box {
      margin-top: 20px;
      padding: 15px;
      border: 1px dashed #a020f0;
      border-radius: 12px;
      background: rgba(160, 32, 240, 0.05);
      display: none;
    }

    .opponent-box h3 {
      margin: 0 0 10px 0;
      color: #fff;
      font-size: 16px;
    }

    .opponent-box p {
      color: #00ffff;
      font-family: monospace;
      font-size: 15px;
      margin: 5px 0 15px 0;
    }

    .coins {
      font-weight: bold;
      margin-bottom: 20px;
      background: rgba(255, 255, 255, 0.03);
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
      color: #ccc;
    }
    
    .coins span {
      color: #fff;
      font-family: monospace;
      font-size: 14px;
    }

    /* DASHBOARD BUTTON */
    .dashboard {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 12px 24px;
      background: #a020f0;
      color: black;
      border-radius: 50px;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 0 20px rgba(160, 32, 240, 0.5);
      transition: 0.3s;
      z-index: 100;
    }

    .dashboard:hover {
      transform: scale(1.05) translateY(-2px);
      box-shadow: 0 0 25px #a020f0;
    }
  </style>
</head>

<body>

<h2>🎮 QUICK MATCH</h2>
<div class="user-welcome" id="quickUserWelcome">PLAYER: SECURING MATRIX...</div>

<div class="box">

  <!-- WALLET DISPLAY -->
  <p class="coins">
    🔴 Red: <span id="red">...</span> |
    🔵 Blue: <span id="blue">...</span> |
    🟣 Super: <span id="purple">...</span>
  </p>

  <!-- ROOM CODE -->
  <input type="text" id="roomCode" placeholder="Enter Efootball Room Code">

  <!-- COIN SELECT -->
  <select id="coinType">
    <option value="red">Red Coin 🔴</option>
    <option value="blue">Blue Coin 🔵</option>
    <option value="super">Super Coin 🟣</option>
  </select>

  <button onclick="searchOpponent()">Search Opponent</button>

  <!-- SEARCHING ANIMATION -->
  <div class="searching-box" id="searchingBox">
    <div class="spinner"></div>
    <p>Inatafuta opponent...</p>
  </div>

  <!-- OPPONENT FOUND WINDOW -->
  <div class="opponent-box" id="opponentBox">
    <h3>Opponent Found 🔥</h3>
    <p>ID: <span id="opponentCode"></span></p>

    <button onclick="acceptMatch()" style="background: #00ff88; color: #000;">Start Match</button>
  </div>

</div>

<!-- DASHBOARD REDIRECT -->
<a class="dashboard" href="dashboard.html">Dashboard</a>

<!-- SCRIPT YA SUPABASE YA SARAFU NA MATCHES -->
<script>
// Kuunganisha Supabase Matrix Keys
const supabaseUrl = "https://ldgnyehqrharqvynohla.supabase.co";
const supabaseAnonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxkZ255ZWhxcmhhcnF2eW5vaGxhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMzgzMDcsImV4cCI6MjA5NDYxNDMwN30.80vZuD20je-8VKDJwoy7P2mFYqY9Vcq3nMd9K-pHYBI";

const supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey);

// Uhakiki wa mchezaji aliyepo sasa hivi kwenye kifaa hiki
let currentUser = localStorage.getItem("dusk_username");
if (!currentUser) {
    alert("Tafadhali nenda kalogin kwanza ili kupata ufikiaji wa Quick Match!");
    window.location.href = "login.html";
}

// Kadi ya utambulisho ya mchezaji juu ya kioo
document.getElementById("quickUserWelcome").innerText = `PLAYER: @${currentUser.toUpperCase()}`;

// Variable ya kushikilia salio la sasa hivi la mchezaji
let currentWallet = { red: 0, blue: 0, super: 0 };
let selectedCoin = "red";

/* === MPYA: variable ya kufuatilia row ya quickmatch ya mchezaji wa sasa === */
let myRowId = null;
let myRealtimeChannel = null;
let myOpponentUsername = null;
let myRoomCode = null;

/* UPDATE UI TO SHOW COINS FROM SUPABASE DYNAMICALLY BY USERNAME */
async function updateUI(){
  try {
    // Tunasoma coin balance kutoka kwenye table ya 'user_profile' kulingana na jina la mchezaji
    let { data, error } = await supabaseClient
        .from('user_profile')
        .select('red_coins, blue_coins, super_coins')
        .eq('username', currentUser)
        .maybeSingle();

    if (error) throw error;

    if (data) {
        currentWallet.red = data.red_coins || 0;
        currentWallet.blue = data.blue_coins || 0;
        currentWallet.super = data.super_coins || 0;

        // Hifadhi kwenye local storage kama backup ya dharura
        localStorage.setItem("wallet_backup_" + currentUser, JSON.stringify(currentWallet));
    }
  } catch (error) {
    console.error("Imefeli kusoma kutoka Supabase, tunatumia backup ya ndani:", error);
    currentWallet = JSON.parse(localStorage.getItem("wallet_backup_" + currentUser)) || { red: 0, blue: 0, super: 0 };
  }

  // Weka data kwenye skrini sasa hivi
  document.getElementById("red").innerText = currentWallet.red;
  document.getElementById("blue").innerText = currentWallet.blue;
  document.getElementById("purple").innerText = currentWallet.super;
}

/* === MPYA: SEARCH OPPONENT (REAL MATCHING KUPITIA SUPABASE) === */
async function searchOpponent(){
  let code = document.getElementById("roomCode").value.trim();
  selectedCoin = document.getElementById("coinType").value;

  if(code === ""){
    alert("Tafadhali weka Efootball Room Code kwanza!");
    return;
  }

  if(currentWallet[selectedCoin] <= 0){
    alert("Huna sarafu za kutosha za " + selectedCoin + " coins!");
    return;
  }

  // Onyesha animation ya kutafuta, ficha opponent box mpaka kupatikane kweli
  myRoomCode = code;
  document.getElementById("opponentBox").style.display = "none";
  document.getElementById("searchingBox").style.display = "block";

  try {
    // Hatua 1: Kama nilikuwa na pending ya zamani, tunai-cancel kwanza kwa kuipa 'expired'
    if (myRowId) {
      await supabaseClient
        .from('efootball_quickmatch')
        .update({ status: 'expired', updated_at: new Date().toISOString() })
        .eq('id', myRowId)
        .eq('status', 'pending...');
    }

    // Hatua 2: Weka row mpya yangu kama 'pending...'
    let { data: myRow, error: insertError } = await supabaseClient
      .from('efootball_quickmatch')
      .insert({
        username: currentUser,
        room_code: code,
        coin: selectedCoin,
        status: 'pending...'
      })
      .select()
      .single();

    if (insertError) throw insertError;

    myRowId = myRow.id;

    // Hatua 3: Tafuta mtu mwingine 'pending...' mwenye coin sawa, si mimi mwenyewe
    let { data: candidates, error: searchError } = await supabaseClient
      .from('efootball_quickmatch')
      .select('*')
      .eq('status', 'pending...')
      .eq('coin', selectedCoin)
      .neq('username', currentUser)
      .gte('created_at', new Date(Date.now() - 30000).toISOString()) // <-- MPYA: puuza pending zilizopitiliza sekunde 30
      .order('created_at', { ascending: true })
      .limit(5);

    if (searchError) throw searchError;

    let matched = null;

    if (candidates && candidates.length > 0) {
      // Jaribu kila candidate mmoja mmoja mpaka ipatikane ambayo bado ni 'pending...'
      for (const candidate of candidates) {
        let { data: claimed, error: claimError } = await supabaseClient
          .from('efootball_quickmatch')
          .update({
            status: `connected...${currentUser}`,
            opponent_username: currentUser,
            updated_at: new Date().toISOString()
          })
          .eq('id', candidate.id)
          .eq('status', 'pending...') // <-- masharti haya yanazuia mgongano wa watu wawili
          .select()
          .maybeSingle();

        if (!claimError && claimed) {
          matched = claimed;
          break;
        }
      }
    }

    if (matched) {
      // Nimemkuta opponent aliyekuwa akisubiri -> update row yangu pia
      await supabaseClient
        .from('efootball_quickmatch')
        .update({
          status: `connected...${matched.username}`,
          opponent_username: matched.username,
          updated_at: new Date().toISOString()
        })
        .eq('id', myRowId);

      showOpponentFound(matched.username);
    } else {
      // Hakuna wa kupatikana sasa hivi -> searchingBox tayari inaonekana, subiri realtime listener
      subscribeToMyMatch();
    }

  } catch (error) {
    console.error("Imefeli kutafuta opponent:", error);
    alert("Muingiliano wa mtandao umefeli! Imeshindikana kutafuta opponent.");
  }
}

/* === MPYA: SIKILIZA KAMA MTU MWINGINE ATANIUNGANISHA MIMI (REALTIME) === */
function subscribeToMyMatch(){
  if (myRealtimeChannel) {
    supabaseClient.removeChannel(myRealtimeChannel);
  }

  myRealtimeChannel = supabaseClient
    .channel('quickmatch_row_' + myRowId)
    .on('postgres_changes', {
        event: 'UPDATE',
        schema: 'public',
        table: 'efootball_quickmatch',
        filter: `id=eq.${myRowId}`
      },
      (payload) => {
        const row = payload.new;
        if (row.status && row.status.startsWith('connected...')) {
          showOpponentFound(row.opponent_username);
        }
      }
    )
    .subscribe();
}

/* === MPYA: ONYESHA OPPONENT ALIYEPATIKANA (FICHA SEARCHING, ONYESHA START BUTTON) === */
function showOpponentFound(opponentUsername){
  myOpponentUsername = opponentUsername;
  document.getElementById("searchingBox").style.display = "none";
  document.getElementById("opponentCode").innerText = opponentUsername;
  document.getElementById("opponentBox").style.display = "block";
}

/* ACCEPT MATCH AND DEDUCT COIN FROM SUPABASE DYNAMICALLY */
async function acceptMatch(){
  if(currentWallet[selectedCoin] <= 0){
    alert("Huna sarafu za kutosha za " + selectedCoin + " coins!");
    return;
  }

  // Punguza sarafu moja kwenye salio la sasa hivi
  let updatedCoins = currentWallet[selectedCoin] - 1;

  try {
      // Tengeneza Object ya update kulingana na aina ya coin iliyochaguliwa
      let updateData = {};
      if(selectedCoin === "red") updateData = { red_coins: updatedCoins };
      if(selectedCoin === "blue") updateData = { blue_coins: updatedCoins };
      if(selectedCoin === "super") updateData = { super_coins: updatedCoins };

      // Katisha coin moja live kwenye profile ya mtumiaji husika
      let { error } = await supabaseClient
          .from('user_profile')
          .update(updateData)
          .eq('username', currentUser);

      if (error) throw error;

      alert("Mechi Imeanza! Sarafu 1 ya " + selectedCoin.toUpperCase() + " imekatwa live kwenye Supabase cloud 🔥");
      
      // Refresh salio jipya kwenye UI
      updateUI();
      document.getElementById("opponentBox").style.display = "none";
      document.getElementById("searchingBox").style.display = "none";
      document.getElementById("roomCode").value = "";

      // Zima realtime listener kwa vile mechi imeshaanza
      if (myRealtimeChannel) {
        supabaseClient.removeChannel(myRealtimeChannel);
        myRealtimeChannel = null;
      }

      // Hifadhi taarifa za match kwa ajili ya q_pvp.html
      localStorage.setItem("current_match", JSON.stringify({
        rowId: myRowId,
        opponent: myOpponentUsername,
        roomCode: myRoomCode,
        coin: selectedCoin
      }));

      // Peleka mchezaji kwenye ukurasa wa PvP
      window.location.href = "q_pvp.html";

  } catch (error) {
      console.error("Imefeli kukata sarafu kwenye Supabase:", error);
      alert("Muingiliano wa mtandao umefeli! Imeshindikana kukata sarafu.");
  }
}

// Kuanzisha mzigo pindi tu ukurasa unapomaliza kufunguka
window.onload = () => {
    updateUI();
};
</script>

</body>
</html>
